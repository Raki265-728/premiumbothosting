<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050508">
<title>{% block title %}BotForge{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="bg"></div>
<div class="orb a"></div>
<div class="orb b"></div>
<div class="orb c"></div>

<!-- ═══════ NAVBAR ═══════ -->
<nav class="nav">
  <a href="/" class="brand">
    <div class="bic">⚡</div>
    <b>Bot<span>Forge</span></b>
  </a>
  <div class="nav-m">
    {% block nav %}
    <a href="/#features">Features</a>
    <a href="/#pricing">Pricing</a>
    <a href="/#faq">FAQ</a>
    <a href="/dashboard" class="nav-cta">Get Started →</a>
    {% endblock %}
  </div>
</nav>

<!-- ═══════ MAIN CONTENT ═══════ -->
{% block body %}{% endblock %}

<!-- ═══════ LOG MODAL (optional) ═══════ -->
<div class="mdl" id="logModal">
  <div class="mdlb">
    <button class="mdc" onclick="closeModal()">✕</button>
    <h3>📄 Bot Logs</h3>
    <pre id="logContent">Loading...</pre>
  </div>
</div>

<!-- ═══════ TOAST ═══════ -->
<div class="tst" id="toast">
  <span class="tsti" id="toastIcon">✅</span>
  <span class="tstm" id="toastMsg">Message</span>
</div>

<!-- ═══════ SHARED JS ═══════ -->
<script>
async function api(path, opts={}) {
  const r = await fetch(path, {credentials:'include', ...opts});
  return r.json();
}

let tt;
function toast(m, t='ok') {
  const el = document.getElementById('toast');
  if (!el) return;
  document.getElementById('toastMsg').textContent = m;
  document.getElementById('toastIcon').textContent = t==='ok'?'✅':t==='err'?'❌':'ℹ️';
  el.className = 'tst show ' + t;
  clearTimeout(tt);
  tt = setTimeout(() => el.classList.remove('show'), 3500);
}

function closeModal() {
  const m = document.getElementById('logModal');
  if (m) m.classList.remove('show');
}

async function showLogs(botId) {
  const m = document.getElementById('logModal');
  if (!m) return;
  m.classList.add('show');
  document.getElementById('logContent').textContent = 'Loading...';
  const r = await fetch(`/api/bot/${botId}/logs`, {credentials:'include'});
  const d = await r.json();
  document.getElementById('logContent').textContent = d.logs || '(empty)';
}

async function logout() {
  await fetch('/api/logout', {method:'POST', credentials:'include'});
  location.href = '/';
}
</script>

{% block scripts %}{% endblock %}
</body>
      </html>
